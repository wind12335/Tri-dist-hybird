<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1D3557"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2A9D8F"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #1D2530; }
      .title { font-size: 24px; font-weight: 700; }
      .section { font-size: 18px; font-weight: 700; }
      .label { font-size: 14px; }
      .small { font-size: 12px; }
      .formula { font-size: 14px; font-family: "Courier New", monospace; }
      .chunk { fill: #ECEFF4; stroke: #8B95A1; stroke-width: 1.4; rx: 8; }
      .active { fill: #D8ECF8; stroke: #2E86AB; stroke-width: 2; rx: 8; }
      .panelBox { fill: #FFF6E6; stroke: #F18F01; stroke-width: 1.8; rx: 10; }
      .stripeBox { fill: #F7E8F1; stroke: #A23B72; stroke-width: 1.8; rx: 10; }
      .workspace { fill: #FFFFFF; stroke: #1D3557; stroke-width: 2; rx: 12; }
      .slot { fill: #FEF4E9; stroke: #F18F01; stroke-width: 1.5; rx: 6; }
      .slotPurple { fill: #F8EEF5; stroke: #A23B72; stroke-width: 1.5; rx: 6; }
      .flagReady { fill: #DDF3EE; stroke: #2A9D8F; stroke-width: 1.4; rx: 10; }
      .flagFree { fill: #FCE8E6; stroke: #C73E1D; stroke-width: 1.4; rx: 10; }
      .note { fill: #F7F9FB; stroke: #B8C2CC; stroke-width: 1.2; rx: 8; }
      .dashed { fill: none; stroke: #C73E1D; stroke-width: 2; stroke-dasharray: 7 5; rx: 14; }
      .arrow { stroke: #1D3557; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrowGreen { stroke: #2A9D8F; stroke-width: 1.8; fill: none; marker-end: url(#arrowGreen); }
      .arrowDashed { stroke: #6B7280; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#FFFFFF"/>
  <text x="600" y="40" text-anchor="middle" class="title">Bounded Staging with Active Window and Slot Reuse</text>

  <!-- Logical chunk stream -->
  <text x="70" y="88" class="section">Shared logical chunk stream</text>
  <rect x="70" y="110" width="120" height="46" class="chunk"/>
  <text x="130" y="138" text-anchor="middle" class="label">retired c0</text>
  <rect x="202" y="110" width="120" height="46" class="chunk"/>
  <text x="262" y="138" text-anchor="middle" class="label">retired c1</text>

  <rect x="366" y="98" width="272" height="78" fill="#F4FAFE" stroke="#2E86AB" stroke-width="2.2" rx="14"/>
  <text x="502" y="92" text-anchor="middle" class="label" fill="#2E86AB">Active window W = 2</text>
  <rect x="386" y="116" width="104" height="44" class="active"/>
  <text x="438" y="143" text-anchor="middle" class="label">active ck</text>
  <rect x="514" y="116" width="104" height="44" class="active"/>
  <text x="566" y="143" text-anchor="middle" class="label">active ck+1</text>

  <rect x="686" y="110" width="128" height="46" class="chunk"/>
  <text x="750" y="138" text-anchor="middle" class="label">upcoming ck+2</text>
  <rect x="826" y="110" width="128" height="46" class="chunk"/>
  <text x="890" y="138" text-anchor="middle" class="label">upcoming ck+3</text>

  <rect x="970" y="102" width="170" height="64" class="note"/>
  <text x="1055" y="126" text-anchor="middle" class="small">Only W chunks</text>
  <text x="1055" y="145" text-anchor="middle" class="small">are resident</text>

  <path d="M502 176 L502 218" class="arrow"/>
  <path d="M502 218 L312 254" class="arrow"/>
  <path d="M502 218 L888 254" class="arrow"/>

  <!-- Left RS panel -->
  <rect x="60" y="245" width="520" height="448" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="18"/>
  <text x="320" y="276" text-anchor="middle" class="section">(a) RS: windowed-panel staging</text>

  <rect x="92" y="304" width="196" height="86" class="panelBox"/>
  <text x="190" y="328" text-anchor="middle" class="label" font-weight="700">Task unit</text>
  <text x="190" y="352" text-anchor="middle" class="formula">panel (c, b)</text>
  <text x="190" y="374" text-anchor="middle" class="small">chunk-band panel</text>

  <rect x="332" y="302" width="210" height="92" class="note"/>
  <text x="437" y="328" text-anchor="middle" class="formula">q = c mod W</text>
  <text x="437" y="352" text-anchor="middle" class="formula">panel_slot = bW + q</text>
  <text x="437" y="376" text-anchor="middle" class="small">W=2, B=2 in this sketch</text>

  <path d="M190 390 L190 428" class="arrow"/>
  <path d="M437 394 L437 428" class="arrow"/>

  <rect x="96" y="430" width="448" height="194" class="workspace"/>
  <text x="320" y="456" text-anchor="middle" class="label" font-weight="700">Destination staging workspace Q_d</text>
  <text x="320" y="477" text-anchor="middle" class="small">bounded panel windows: W x B slots</text>

  <rect x="132" y="498" width="178" height="46" class="slot"/>
  <text x="150" y="526" class="small" font-weight="700">q0, B0</text>
  <text x="235" y="526" text-anchor="middle" class="small">src0 | src1 | src2 | src3</text>
  <rect x="330" y="498" width="178" height="46" class="slot"/>
  <text x="348" y="526" class="small" font-weight="700">q0, B1</text>
  <text x="433" y="526" text-anchor="middle" class="small">src0 | src1 | src2 | src3</text>

  <rect x="132" y="560" width="178" height="46" class="slot"/>
  <text x="150" y="588" class="small" font-weight="700">q1, B0</text>
  <text x="235" y="588" text-anchor="middle" class="small">src0 | src1 | src2 | src3</text>
  <rect x="330" y="560" width="178" height="46" class="slot"/>
  <text x="348" y="588" class="small" font-weight="700">q1, B1</text>
  <text x="433" y="588" text-anchor="middle" class="small">src0 | src1 | src2 | src3</text>

  <rect x="92" y="646" width="196" height="28" class="flagReady"/>
  <text x="190" y="665" text-anchor="middle" class="small">ready flag after copy</text>
  <rect x="316" y="646" width="196" height="28" class="flagFree"/>
  <text x="414" y="665" text-anchor="middle" class="small">free flag after reduce</text>
  <path d="M288 660 L316 660" class="arrowGreen"/>

  <path d="M128 416 C128 382, 246 382, 246 416" class="arrowDashed"/>
  <text x="187" y="408" text-anchor="middle" class="small">ck -> q0</text>
  <path d="M276 416 C276 382, 480 382, 480 416" class="arrowDashed"/>
  <text x="378" y="408" text-anchor="middle" class="small">ck+2 -> q0 after free</text>

  <!-- Right AR panel -->
  <rect x="620" y="245" width="520" height="448" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="18"/>
  <text x="880" y="276" text-anchor="middle" class="section">(b) AR: compact-stripe staging</text>

  <rect x="650" y="304" width="180" height="86" class="stripeBox"/>
  <text x="740" y="328" text-anchor="middle" class="label" font-weight="700">Panel split</text>
  <text x="740" y="350" text-anchor="middle" class="formula">Ck.B0 -> S0..S3</text>
  <text x="740" y="374" text-anchor="middle" class="small">stripe is the staging unit</text>

  <rect x="862" y="302" width="238" height="92" class="note"/>
  <text x="981" y="326" text-anchor="middle" class="formula">task_id = flatten(c,b,t)</text>
  <text x="981" y="350" text-anchor="middle" class="formula">r = task_id mod R</text>
  <text x="981" y="376" text-anchor="middle" class="small">R=4 compact stage slots</text>

  <rect x="668" y="410" width="56" height="30" class="slotPurple"/>
  <text x="696" y="430" text-anchor="middle" class="small">S0</text>
  <rect x="732" y="410" width="56" height="30" class="slotPurple"/>
  <text x="760" y="430" text-anchor="middle" class="small">S1</text>
  <rect x="796" y="410" width="56" height="30" class="slotPurple"/>
  <text x="824" y="430" text-anchor="middle" class="small">S2</text>
  <rect x="860" y="410" width="56" height="30" class="slotPurple"/>
  <text x="888" y="430" text-anchor="middle" class="small">S3</text>
  <path d="M740 390 L740 410" class="arrow"/>
  <path d="M888 394 L888 430" class="arrow"/>

  <rect x="650" y="462" width="452" height="162" class="workspace"/>
  <text x="876" y="488" text-anchor="middle" class="label" font-weight="700">Compact staging workspace Q_d</text>
  <text x="876" y="509" text-anchor="middle" class="small">bounded stripe slots: R slots, each stores one stripe from all sources</text>

  <rect x="684" y="530" width="182" height="34" class="slotPurple"/>
  <text x="704" y="552" class="small" font-weight="700">r0</text>
  <text x="788" y="552" text-anchor="middle" class="small">stripe, src0 | src1 | src2 | src3</text>
  <rect x="886" y="530" width="182" height="34" class="slotPurple"/>
  <text x="906" y="552" class="small" font-weight="700">r1</text>
  <text x="990" y="552" text-anchor="middle" class="small">stripe, src0 | src1 | src2 | src3</text>

  <rect x="684" y="576" width="182" height="34" class="slotPurple"/>
  <text x="704" y="598" class="small" font-weight="700">r2</text>
  <text x="788" y="598" text-anchor="middle" class="small">stripe, src0 | src1 | src2 | src3</text>
  <rect x="886" y="576" width="182" height="34" class="slotPurple"/>
  <text x="906" y="598" class="small" font-weight="700">r3</text>
  <text x="990" y="598" text-anchor="middle" class="small">stripe, src0 | src1 | src2 | src3</text>

  <rect x="650" y="646" width="196" height="28" class="flagReady"/>
  <text x="748" y="665" text-anchor="middle" class="small">ready flag after copy</text>
  <rect x="874" y="646" width="196" height="28" class="flagFree"/>
  <text x="972" y="665" text-anchor="middle" class="small">free flag after reduce</text>
  <path d="M846 660 L874 660" class="arrowGreen"/>

  <path d="M696 440 L696 530" class="arrowDashed"/>
  <text x="720" y="486" class="small">S0 -> r0</text>
  <path d="M930 442 C1050 442, 1070 486, 986 530" class="arrowDashed"/>
  <text x="1010" y="456" text-anchor="middle" class="small">next stripe -> r0 after free</text>

  <!-- Bottom comparison -->
  <rect x="198" y="712" width="804" height="32" class="note"/>
  <text x="600" y="733" text-anchor="middle" class="label">
    RS resident units: W x B panel windows; AR resident units: R compact stripe slots; ready/free flags enforce safe reuse.
  </text>
</svg>
